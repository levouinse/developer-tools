name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Supaya lu bisa klik tombol 'Run workflow' manual kapan aja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/copy-devtools.sh

      - name: Run DevTools Copy Script
        run: ./scripts/copy-devtools.sh

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
