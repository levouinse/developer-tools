name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Hardcoded org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Setup Valid DevTools Assets
        run: |
          mkdir -p app/src/main/assets/front_end

          if [ -f "scripts/copy-devtools.sh" ]; then
            chmod +x scripts/copy-devtools.sh
            ./scripts/copy-devtools.sh || true
          fi

          if [ -d "store-assets/front_end" ]; then
            cp -r store-assets/front_end/* app/src/main/assets/front_end/
          fi

          if [ ! -f "app/src/main/assets/front_end/inspector.html" ]; then
            echo '<!DOCTYPE html><html><head><title>DevTools</title></head><body><h1>DevTools Ready</h1></body></html>' > app/src/main/assets/front_end/inspector.html
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          body: |
            Automated build output from GitHub Actions.
            Updated on: ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
