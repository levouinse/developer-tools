name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Mock DevTools Assets
        run: |
          # Buat direktori target tempat app membaca assets devtools
          mkdir -p app/src/main/assets/front_end

          # Cek jika folder source devtools lokal/store-assets ada
          if [ -d "store-assets/front_end" ]; then
            cp -r store-assets/front_end/* app/src/main/assets/front_end/
          else
            # Unduh DevTools frontend siap pakai langsung dari Chrome DevTools release
            echo "Downloading prebuilt Chrome DevTools..."
            curl -sL https://chrome-devtools-frontend.appspot.com/serve_file/@8e718f4a132e01df28003fbe1b3f9479e0a05891/inspector.html -o app/src/main/assets/front_end/inspector.html || true
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
