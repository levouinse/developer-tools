name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Hardcoded org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Setup Valid DevTools Assets
        run: |
          # Buat folder assets front_end yang dibutuhkan Android App
          mkdir -p app/src/main/assets/front_end

          # Jika folder store-assets ada, copy isinya
          if [ -d "store-assets/front_end" ]; then
            cp -r store-assets/front_end/* app/src/main/assets/front_end/
          fi

          # Buat file HTML dasar jika kosong agar aset WebView valid
          if [ ! -f "app/src/main/assets/front_end/inspector.html" ]; then
            echo '<!DOCTYPE html><html><head><title>DevTools</title></head><body><h1>DevTools Ready</h1></body></html>' > app/src/main/assets/front_end/inspector.html
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
