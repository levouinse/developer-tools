name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Hardcoded org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Force minSdk to API 26 (Android 8.0+) & targetSdk to API 30 (Android 11)
        run: |
          python3 -c '
          import re
          path = "app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()
          
          # Paksa minSdk ke 26 (Android 8.0) agar Android 11 lu bisa install tanpa Parse Error
          content = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 26", content)
          content = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 30", content)
          content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", content)
          
          with open(path, "w") as f:
              f.write(content)
          '
          echo "Updated app/build.gradle.kts successfully!"

      - name: Setup Mock DevTools Assets
        run: |
          mkdir -p app/src/main/assets/front_end
          if [ -d "store-assets/front_end" ]; then
            cp -r store-assets/front_end/* app/src/main/assets/front_end/
          else
            echo "Downloading prebuilt Chrome DevTools..."
            curl -sL https://chrome-devtools-frontend.appspot.com/serve_file/@8e718f4a132e01df28003fbe1b3f9479e0a05891/inspector.html -o app/src/main/assets/front_end/inspector.html || true
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
