name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Otomatis jalan dan bikin Release kalau push tag (contoh: v1.0.0)
  workflow_dispatch: # Bisa dijalankan manual kapan saja dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Wajib ada izin ini agar GitHub Actions bisa mempublikasikan Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Hardcoded org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Adjust SDK Version for Android 11 Compatibility
        run: |
          # Mengubah targetSdk & compileSdk agar kompatibel dan tidak Parse Error di Android 11
          sed -i 's/targetSdk = 35/targetSdk = 30/g' app/build.gradle.kts || true
          sed -i 's/compileSdk = 35/compileSdk = 34/g' app/build.gradle.kts || true

      - name: Setup Mock DevTools Assets
        run: |
          mkdir -p app/src/main/assets/front_end
          if [ -d "store-assets/front_end" ]; then
            cp -r store-assets/front_end/* app/src/main/assets/front_end/
          else
            echo "Downloading prebuilt Chrome DevTools..."
            curl -sL https://chrome-devtools-frontend.appspot.com/serve_file/@8e718f4a132e01df28003fbe1b3f9479e0a05891/inspector.html -o app/src/main/assets/front_end/inspector.html || true
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
